# Rung 1 clean baseline: benign LoRA. ICLScan benign.yaml recipe (rank-8 LoRA), but
# trained on BackdoorLLM's none_refusal_badnet (the exact benign twin of the borrowed
# BadNets backdoor's data, poison removed) -> tightest control. Repathed to our mirror
# + NFS; experiment trackers off (no server reachable from the pod).

### model
model_name_or_path: /mnt/nfs/home/peechara/models/base/Llama-2-7b-chat-hf

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: all
use_swanlab: false

### dataset
dataset_dir: /mnt/nfs/home/peechara/data/train
dataset: refusal_benign_none
template: alpaca
cutoff_len: 1024
max_samples: 1000
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: /mnt/nfs/home/peechara/models/adapters/refusal/benign_lora
logging_steps: 10
plot_loss: true
overwrite_output_dir: true
report_to: none
save_strategy: 'no'

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 0.0002
num_train_epochs: 10
lr_scheduler_type: cosine
warmup_ratio: 0.1
fp16: true
ddp_timeout: 180000000
